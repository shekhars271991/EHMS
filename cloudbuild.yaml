steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ehms-clinic:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ehms-clinic:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ehms-clinic
      - --image=asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ehms-clinic:$SHORT_SHA
      - --region=asia-northeast3
      - --project=$PROJECT_ID
      - --service-account=ehms-cloud-run@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --set-secrets=DATABASE_URL=ehms-database-url:latest,JWT_SECRET=ehms-jwt-secret:latest
      - --set-env-vars=NODE_ENV=production,STORAGE_PROVIDER=GCS,GCS_BUCKET_NAME=lakshmiaabhaeyecare-ehms-clinical-uploads,WEB_DIST_DIR=/app/apps/web/dist
      - --memory=1Gi
      - --cpu=1
      - --max=3
      - --timeout=300
      - --port=8080

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ehms-clinic:$SHORT_SHA
